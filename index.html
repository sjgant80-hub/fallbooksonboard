  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function uuid(){return (crypto.randomUUID?crypto.randomUUID():('xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16))+Date.now().toString(16)))}
function now(){return Date.now()}
function esc(s){if(s==null)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(t){if(!t)return '—';const d=new Date(t);if(isNaN(d))return '—';return d.toISOString().slice(0,10)}
function fmtDT(t){if(!t)return '—';const d=new Date(t);if(isNaN(d))return '—';return d.toISOString().slice(0,16).replace('T',' ')}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function addDays(t,d){return t+(d*86400000)}
async function sha256(s){const buf=s instanceof ArrayBuffer?s:new TextEncoder().encode(typeof s==='string'?s:JSON.stringify(s));const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function sha256Blob(blob){const buf=await blob.arrayBuffer();return sha256(buf)}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function download(name,content,mime='text/plain'){const blob=content instanceof Blob?content:new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function toast(msg,kind=''){const t=$('#toast');t.textContent=msg;t.className='toast show'+(kind?' '+kind:'');clearTimeout(t._t);t._t=setTimeout(()=>{t.className='toast'},2400)}

// ════════════════════════════════════════════════════════════════
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(STORE,SCHEMA_V);
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('firms'))d.createObjectStore('firms',{keyPath:'id'});
      if(!d.objectStoreNames.contains('advisers'))d.createObjectStore('advisers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('clients'))d.createObjectStore('clients',{keyPath:'id'});
      if(!d.objectStoreNames.contains('cddDocuments'))d.createObjectStore('cddDocuments',{keyPath:'id'});
      if(!d.objectStoreNames.contains('pscCache'))d.createObjectStore('pscCache',{keyPath:'id'});
      if(!d.objectStoreNames.contains('audit'))d.createObjectStore('audit',{keyPath:'i'});
      if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'k'});
      if(!d.objectStoreNames.contains('engagementQueue'))d.createObjectStore('engagementQueue',{keyPath:'id'});
    };
    rq.onsuccess=e=>{db=e.target.result;res(db)};
    rq.onerror=e=>rej(e);
  });
}
async function dbPut(store,val){
  if(!db)await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);
    tx.oncomplete=()=>res(val);tx.onerror=e=>rej(e);
  });
}
async function dbGet(store,k){
  if(!db)await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(store,'readonly').objectStore(store).get(k);
    rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);
  });
}
async function dbAll(store){
  if(!db)await openDB();
  return new Promise((res,rej)=>{
    const rq=db.transaction(store,'readonly').objectStore(store).getAll();
    rq.onsuccess=()=>res(rq.result||[]);rq.onerror=e=>rej(e);
  });
}
async function dbDel(store,k){
  if(!db)await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(k);
    tx.oncomplete=()=>res();tx.onerror=e=>rej(e);
  });
}
async function dbClear(store){
  if(!db)await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(store,'readwrite');tx.objectStore(store).clear();
    tx.oncomplete=()=>res();tx.onerror=e=>rej(e);
  });
}

// AUDIT
// ════════════════════════════════════════════════════════════════
async function audit(action,clientId,reasoning,payload){
  const i=state.audit.length+1;
  const prevHash=state.audit.length?state.audit[state.audit.length-1].docHash:'GENESIS';
  const ts=now();
  const entry={
    i,ts,
    tool:TOOLNAME,
    adviserId:state.activeAdviserId||'',
    clientId:clientId||'',
    action,
    reasoning:reasoning||'',
    configVersion:`${TOOLNAME}@${VERSION}`,
    prevHash,
    payload:payload||{}
  };
  entry.docHash=await sha256(JSON.stringify({prevHash,ts,action,clientId:entry.clientId,payload:entry.payload}));
  state.audit.push(entry);
  if(state.audit.length>AUDIT_CAP)state.audit=state.audit.slice(-AUDIT_CAP);
  await dbPut('audit',entry);
}

// MESH (fall-books + fall-signal)
// ════════════════════════════════════════════════════════════════
let bcBooks=null,bcSignal=null;
function meshBoot(){
  try{
    bcBooks=new BroadcastChannel('fall-books');
    bcBooks.onmessage=onBooks;
    bcSignal=new BroadcastChannel('fall-signal');
    bcSignal.onmessage=onSignal;
    bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()});
    bcBooks.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{}});
  }catch(e){console.warn('BroadcastChannel unavailable',e)}
}
const _bcastDebounced=debounce((type,payload)=>{
  try{if(bcBooks)bcBooks.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}
},300);
function broadcast(type,payload){_bcastDebounced(type,payload)}
function broadcastNow(type,payload){
  try{if(bcBooks)bcBooks.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}
}
async function onBooks(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;
  if(m.type==='sync.request'){
    const snap={
      clients:state.clients,
      advisers:state.advisers,
      firm:state.firm
    };
    try{bcBooks.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:snap})}catch(_){}
    return;
  }
  if(m.type==='sync.snapshot'&&m.payload){
    const snap=m.payload;
    let changed=false;
    if(snap.firm&&(!state.firm||(snap.firm.updatedAt||0)>(state.firm.updatedAt||0))){state.firm=snap.firm;await dbPut('firms',snap.firm);changed=true}
    if(Array.isArray(snap.advisers)){
      for(const a of snap.advisers){
        const cur=state.advisers.find(x=>x.id===a.id);
        if(!cur||(a.updatedAt||0)>(cur.updatedAt||0)){
          if(cur)Object.assign(cur,a);else state.advisers.push(a);
          await dbPut('advisers',a);changed=true;
        }
      }
    }
    if(Array.isArray(snap.clients)){
      for(const c of snap.clients){
        const cur=state.clients.find(x=>x.id===c.id);
        if(!cur||(c.updatedAt||0)>(cur.updatedAt||0)){
          if(cur)Object.assign(cur,c);else state.clients.push(c);
          await dbPut('clients',c);changed=true;
        }
      }
    }
    if(changed)render();
    return;
  }
  if((m.type==='client.created'||m.type==='client.updated')&&m.payload){
    const c=m.payload;
    const cur=state.clients.find(x=>x.id===c.id);
    if(!cur||(c.updatedAt||0)>(cur.updatedAt||0)){
      if(cur)Object.assign(cur,c);else state.clients.push(c);
      await dbPut('clients',c);render();
    }
    return;
  }
  if(m.type==='adviser.updated'&&m.payload){
    const a=m.payload;
    const cur=state.advisers.find(x=>x.id===a.id);
    if(!cur||(a.updatedAt||0)>(cur.updatedAt||0)){
      if(cur)Object.assign(cur,a);else state.advisers.push(a);
      await dbPut('advisers',a);render();
    }
    return;
  }
  if(m.type==='firm.updated'&&m.payload){
    state.firm=m.payload;await dbPut('firms',m.payload);render();return;
  }
  if(m.type==='psc.fetched'&&m.payload&&m.payload.companyNo){
    const rec={id:m.payload.companyNo,...m.payload,fetchedAt:now()};
    await dbPut('pscCache',rec);
    const idx=state.pscCache.findIndex(x=>x.id===rec.id);
    if(idx>=0)state.pscCache[idx]=rec;else state.pscCache.push(rec);
    render();
  }
}
function onSignal(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;
  if(m.type==='ping'&&bcSignal)bcSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME,version:VERSION,ts:now()});
}

// AML risk grading (auto-suggest from inputs)
// ════════════════════════════════════════════════════════════════
function suggestRisk(c){
  let score=0;
  const k=c.kyc||{};
  if(k.pepFlag)score+=3;
  if(k.cashHeavyFlag)score+=2;
  if(k.highRiskGeoFlag)score+=2;
  if(c.entityType==='trust')score+=2;
  if(c.entityType==='charity')score+=1;
  if(c.entityType==='other')score+=1;
  const numPSC=(c.beneficialOwners?.length||0)+(c.pscFromCompaniesHouse?.length||0);
  if(numPSC>=4)score+=1;
  if(k.sanctionsStatus==='match'||k.sanctionsStatus==='review')score+=3;
  if(score>=4)return 'high';
  if(score>=2)return 'medium';
  return 'low';
}

function computeNextReview(grade){return addDays(now(),RISK_REVIEW_DAYS[grade]||365)}

async function captureDoc(clientId,file,type,note,expDays){
  const id='doc_'+uuid();
  const hash=await sha256Blob(file);
  const rec={
    id,clientId,filename:file.name,type,mime:file.type||'',size:file.size,
    sha256:hash,capturedAt:now(),note:note||'',blob:file
  };
  await dbPut('cddDocuments',rec);
  return {
    id,type,filename:file.name,blobRef:id,sha256:hash,size:file.size,mime:rec.mime,
    capturedAt:rec.capturedAt,
    expiresAt:expDays?addDays(rec.capturedAt,expDays):null,
    verifiedBy:state.activeAdviserId||'',
    note:note||''
  };
}

async function getDocBlob(blobRef){
  const r=await dbGet('cddDocuments',blobRef);
  return r?.blob||null;
}

    case 'dashboard':v.innerHTML=renderDashboard();break;

  `<table>
    <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Risk</th><th>Services</th><th>Adviser</th><th>Next AML review</th></tr></thead>
    <tbody>${filtered.map(c=>clientRow(c)).join('')}</tbody>

}
function clientRow(c){
  const name=esc(displayName(c));
  const etype=ENTITY_TYPES.find(e=>e.id===c.entityType)?.label||c.entityType;
  const risk=c.kyc?.riskGrade||'low';
  const status=c.onboardingStatus||'in-progress';
  const statusTag=status==='committed'?'<span class="tag green">committed</span>':'<span class="tag amber">draft</span>';
  const adv=state.advisers.find(a=>a.id===c.adviserId)?.name||'—';
  const next=c.kyc?.nextReviewDue?fmtDate(c.kyc.nextReviewDue):'—';
  const overdue=c.kyc?.nextReviewDue&&c.kyc.nextReviewDue<now();
  const due30=c.kyc?.nextReviewDue&&!overdue&&c.kyc.nextReviewDue<addDays(now(),30);
  const svcs=(c.servicesEngaged||[]).slice(0,3).map(s=>SERVICES.find(x=>x.id===s)?.label.split(' ')[0]||s).join(', ')+((c.servicesEngaged||[]).length>3?'…':'');
  return `<tr class="row-link" onclick="openClient('${c.id}')">
    <td><strong>${name}</strong></td>
    <td>${esc(etype)}</td>
    <td>${statusTag}</td>
    <td><span class="risk-pill risk-${risk}">${risk}</span></td>
    <td>${esc(svcs||'—')}</td>
    <td>${esc(adv)}</td>
    <td class="${overdue?'r':''}">${overdue?'<span class="tag ox">overdue '+next+'</span>':due30?'<span class="tag amber">'+next+'</span>':next}</td>
  </tr>`;
}
function displayName(c){
  if(ENTITY_TYPES.find(e=>e.id===c.entityType)?.ind){
    return [c.title,c.firstName,c.middleName,c.lastName].filter(Boolean).join(' ')||'(unnamed)';
  }
  return c.entityName||'(unnamed entity)';
}

const STEPS=[

function newClient(){
  const c=newClientRecord();
  state.clients.push(c);
  state.wizardClientId=c.id;

  state.currentClientId=null;
  audit('client.draft','','New client draft started',{id:c.id});

function getWizClient(){return state.clients.find(c=>c.id===state.wizardClientId)}

function renderWizard(){
  const c=getWizClient();if(!c)return renderClientsList();
  const isInd=ENTITY_TYPES.find(e=>e.id===c.entityType)?.ind;
  return `
  <div class="section-h">
    <div><h2>New client onboarding</h2><div class="sub">${esc(displayName(c))||'draft'} · step ${state.wizardStep} of ${STEPS.length}</div></div>

      <button class="btn ghost" onclick="cancelWizard()">&larr; back to list</button>
    </div>
  </div>
  <div class="wizard">

    <div class="wizard-body">${wizardStep(c,isInd)}</div>
    <div class="wizard-foot">
      <button class="btn ghost" ${state.wizardStep===1?'disabled':''} onclick="wizPrev()">&larr; previous</button>

    </div>
  </div>
  <div class="foot">${TOOLNAME} v${VERSION} · prime ${PRIME}</div>`;
}

function wizardStep(c,isInd){
  switch(state.wizardStep){
    case 1: return stepEntity(c);
    case 2: return stepIdentity(c,isInd);
    case 3: return stepContact(c);
    case 4: return stepPSC(c);
    case 5: return stepServices(c);
    case 6: return stepCDD(c);
    case 7: return stepSoF(c);
    case 8: return stepPEP(c);
    case 9: return stepDocs(c,isInd);

  return '';
}

function stepCommit(c){
  const isInd=ENTITY_TYPES.find(e=>e.id===c.entityType)?.ind;
  const numBO=(c.beneficialOwners||[]).length+(c.pscFromCompaniesHouse||[]).length;
  const numDocs=(c.kyc.documentsHeld||[]).length;
  const numSvcs=(c.servicesEngaged||[]).length;
  const issues=[];
  if(isInd&&!c.firstName)issues.push('Individual identity missing first name');
  if(!isInd&&!c.entityName)issues.push('Entity name missing');
  if(!isInd&&!c.companiesHouseNo&&c.entityType==='limited-company')issues.push('Companies House no missing for limited company');
  if(numSvcs===0)issues.push('No services selected');
  if(!isInd&&numBO===0)issues.push('No beneficial owners / PSC entered');
  if(numDocs===0)issues.push('No CDD documents captured');
  if(!c.kyc.sourceOfFundsForServices)issues.push('Source of funds for our fees not stated');
  if(!c.kyc.natureAndPurposeOfBusiness)issues.push('Nature & purpose of business not stated');
  if(c.kyc.sanctionsStatus==='not-checked')issues.push('Sanctions check not run');
  if(c.kyc.sanctionsStatus==='match')issues.push('SANCTIONS MATCH — must not onboard');
  return `
    <h3>Step 11 · Confirm &amp; commit</h3>
    <div class="step-sub">Review the BookClient about to be written to IDB and broadcast on <code>fall-books</code>. On commit: audit entry, engagement letter draft hash, deadlines seeded.</div>
    ${issues.length?`<div class="banner warn"><strong>${issues.length} gap${issues.length>1?'s':''}:</strong><ul style="margin:6px 0 0 18px">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:`<div class="banner success">All required fields populated. Ready to commit.</div>`}
    <div class="grid-2">
      <div class="card">
        <h3>Identity</h3>
        <div class="kpi"><span class="l">Type</span><span class="v brass">${esc(ENTITY_TYPES.find(e=>e.id===c.entityType)?.label||c.entityType)}</span></div>
        <div class="kpi"><span class="l">Name</span><span class="v">${esc(displayName(c))}</span></div>
        ${!isInd?`<div class="kpi"><span class="l">CH no</span><span class="v">${esc(c.companiesHouseNo||'—')}</span></div>`:''}
        ${!isInd?`<div class="kpi"><span class="l">VAT scheme</span><span class="v">${esc(c.vatScheme||'—')}</span></div>`:''}
        ${!isInd?`<div class="kpi"><span class="l">Year end</span><span class="v">${esc(c.yearEnd||'—')}</span></div>`:''}
        ${isInd?`<div class="kpi"><span class="l">NINO</span><span class="v">${esc(c.nino||'—')}</span></div>`:''}
      </div>
      <div class="card">
        <h3>AML / CDD</h3>
        <div class="kpi"><span class="l">Risk grade</span><span class="v ${c.kyc.riskGrade==='high'?'red':c.kyc.riskGrade==='medium'?'amber':'green'}">${esc(c.kyc.riskGrade)}</span></div>
        <div class="kpi"><span class="l">PEP flag</span><span class="v ${c.kyc.pepFlag?'amber':''}">${c.kyc.pepFlag?'yes':'no'}</span></div>
        <div class="kpi"><span class="l">Sanctions</span><span class="v ${c.kyc.sanctionsStatus==='clear'?'green':c.kyc.sanctionsStatus==='match'?'red':'amber'}">${esc(c.kyc.sanctionsStatus)}</span></div>
        <div class="kpi"><span class="l">Supervisor</span><span class="v">${esc(c.kyc.amlSupervisor)}</span></div>
        <div class="kpi"><span class="l">Next review</span><span class="v">${fmtDate(computeNextReview(c.kyc.riskGrade))}</span></div>
      </div>
      <div class="card">
        <h3>BO / PSC</h3>
        <div class="kpi"><span class="l">Beneficial owners</span><span class="v">${(c.beneficialOwners||[]).length}</span></div>
        <div class="kpi"><span class="l">PSC entries</span><span class="v">${(c.pscFromCompaniesHouse||[]).length}</span></div>
      </div>
      <div class="card">
        <h3>Engagement</h3>
        <div class="kpi"><span class="l">Services</span><span class="v">${numSvcs}</span></div>
        <div class="kpi"><span class="l">Fee basis</span><span class="v">${esc(c.engagement.feeBasis)}</span></div>
        <div class="kpi"><span class="l">Fee amount</span><span class="v brass">£${Number(c.engagement.feeAmount||0).toFixed(2)} ${esc(c.engagement.feeFrequency)}</span></div>
        <div class="kpi"><span class="l">Documents</span><span class="v">${numDocs}</span></div>
      </div>
    </div>
  `;
}

function bindWizard(){
  const c=getWizClient();if(!c)return;
  const step=state.wizardStep;
  if(step===1){
    document.querySelectorAll('input[name=etype]').forEach(r=>r.onchange=e=>{c.entityType=e.target.value});
    $('#w_desc')&&($('#w_desc').oninput=e=>{c.tradingName=e.target.value});
  }
  if(step===2){
    const isInd=ENTITY_TYPES.find(e=>e.id===c.entityType)?.ind;
    if(isInd){
      $('#w_title').oninput=e=>{c.title=e.target.value};
      $('#w_fn').oninput=e=>{c.firstName=e.target.value};
      $('#w_mn').oninput=e=>{c.middleName=e.target.value};
      $('#w_ln').oninput=e=>{c.lastName=e.target.value};
      $('#w_dob').oninput=e=>{c.dob=e.target.value};
      $('#w_nino').oninput=e=>{c.nino=e.target.value.toUpperCase()};
      $('#w_utr').oninput=e=>{c.utr=e.target.value};
      $('#w_trading').oninput=e=>{c.tradingName=e.target.value};
    }else{
      $('#w_ename').oninput=e=>{c.entityName=e.target.value};
      $('#w_trading').oninput=e=>{c.tradingName=e.target.value};
      $('#w_chno').oninput=e=>{c.companiesHouseNo=e.target.value.replace(/\s+/g,'')};
      $('#w_inc').oninput=e=>{c.incorporationDate=e.target.value};
      $('#w_ctutr').oninput=e=>{c.ctUtr=e.target.value};
      $('#w_vat').oninput=e=>{c.vatNumber=e.target.value};
      $('#w_vatscheme').onchange=e=>{c.vatScheme=e.target.value};
      $('#w_paye').oninput=e=>{c.payeReference=e.target.value};
      $('#w_ape').oninput=e=>{c.accountingPeriodEnd=e.target.value;if(e.target.value){const d=new Date(e.target.value);if(!isNaN(d))c.yearEnd=String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}};
      $('#w_ye').oninput=e=>{c.yearEnd=e.target.value};
      $('#w_sc').oninput=e=>{c.shareCapital=e.target.value};
    }
  }
  if(step===3){
    $('#w_email').oninput=e=>{c.email=e.target.value};
    $('#w_phone').oninput=e=>{c.phone=e.target.value};
    $('#w_a1').oninput=e=>{c.address.line1=e.target.value};
    $('#w_a2').oninput=e=>{c.address.line2=e.target.value};
    $('#w_acity').oninput=e=>{c.address.city=e.target.value};
    $('#w_aregion').onchange=e=>{c.address.region=e.target.value};
    $('#w_apc').oninput=e=>{c.address.postcode=e.target.value.toUpperCase()};
    $('#w_asince').oninput=e=>{c.address.since=e.target.value};
    $('#w_sameaddr').onchange=e=>{c.sameTradingAddress=e.target.checked;$('#w_tradingbox').style.display=e.target.checked?'none':''};
    $('#w_t1')&&($('#w_t1').oninput=e=>{c.tradingAddress.line1=e.target.value});
    $('#w_tcity')&&($('#w_tcity').oninput=e=>{c.tradingAddress.city=e.target.value});
    $('#w_tpc')&&($('#w_tpc').oninput=e=>{c.tradingAddress.postcode=e.target.value.toUpperCase()});
  }
  if(step===5){
    document.querySelectorAll('input[name=svc]').forEach(r=>r.onchange=e=>{
      const v=e.target.value;
      const set=new Set(c.servicesEngaged||[]);
      if(e.target.checked)set.add(v);else set.delete(v);
      c.servicesEngaged=[...set];
    });
  }
  if(step===6){
    $('#w_sector').oninput=e=>{c.kyc.cashHeavyNotes=e.target.value};
    $('#w_cash').onchange=e=>{c.kyc.cashHeavyFlag=e.target.checked;renderWizardOnly()};
    $('#w_geo').onchange=e=>{c.kyc.highRiskGeoFlag=e.target.checked;renderWizardOnly()};
    $('#w_geonote').oninput=e=>{c.kyc.highRiskGeoNotes=e.target.value};
    $('#w_risk').onchange=e=>{c.kyc.riskGrade=e.target.value};
    $('#w_riskreason').oninput=e=>{c.kyc.notes=e.target.value};
  }
  if(step===7){
    $('#w_sof').oninput=e=>{c.kyc.sourceOfFundsForServices=e.target.value};
    $('#w_nature').oninput=e=>{c.kyc.natureAndPurposeOfBusiness=e.target.value};
    $('#w_pattern').oninput=e=>{c.kyc.expectedTransactionPatterns=e.target.value};
  }
  if(step===8){
    $('#w_pep').onchange=e=>{c.kyc.pepFlag=e.target.checked};
    $('#w_pepdetails').oninput=e=>{c.kyc.pepDetails=e.target.value};
    $('#w_san').onchange=e=>{c.kyc.sanctionsStatus=e.target.value;c.kyc.sanctionsCheckedAt=now();c.kyc.sanctionsCheckedBy=state.activeAdviserId};
  }
  if(step===9){
    const dz=$('#dz'),f=$('#docFile');
    dz.onclick=()=>f.click();
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('hover')};
    dz.ondragleave=()=>dz.classList.remove('hover');
    dz.ondrop=async e=>{e.preventDefault();dz.classList.remove('hover');if(e.dataTransfer.files[0])await handleDocUpload(e.dataTransfer.files[0])};
    f.onchange=async e=>{if(e.target.files[0])await handleDocUpload(e.target.files[0])};
  }
  if(step===10){
    $('#w_etype').onchange=e=>{c.engagement.type=e.target.value};
    $('#w_estart').onchange=e=>{c.engagement.startedAt=e.target.value?Date.parse(e.target.value):null};

function gotoStep(n){
  if(n<1||n>STEPS.length)return;
  saveDraftAndGo(n);
}
function wizNext(){if(state.wizardStep<STEPS.length)saveDraftAndGo(state.wizardStep+1)}
function wizPrev(){if(state.wizardStep>1)saveDraftAndGo(state.wizardStep-1)}
async function saveDraftAndGo(n){
  const c=getWizClient();if(c){c.updatedAt=now();await dbPut('clients',c)}
  state.wizardStep=n;render();
}

function cancelWizard(){

}

async function commitWizard(){
  const c=getWizClient();if(!c)return;
  const isInd=ENTITY_TYPES.find(e=>e.id===c.entityType)?.ind;
  if(c.kyc.sanctionsStatus==='match'){toast('Cannot commit — sanctions match','warn');return}
  if(!isInd&&!c.entityName){toast('Entity name required','warn');return}
  if(isInd&&!c.firstName){toast('First name required','warn');return}
  c.kyc.lastReviewAt=now();
  c.kyc.nextReviewDue=computeNextReview(c.kyc.riskGrade||'low');
  c.engagement.nextReviewDue=addDays(now(),365);
  c.engagement.startedAt=c.engagement.startedAt||now();
  c.engagement.letterOfEngagementHash=await sha256(JSON.stringify({
    id:c.id,scope:c.servicesEngaged,fee:c.engagement.feeAmount,basis:c.engagement.feeBasis,
    parties:[state.firm.name,displayName(c)],startedAt:c.engagement.startedAt
  }));
  c.engagement.letterOfEngagementSignedAt=now();
  c.onboardingStatus='committed';
  if(c.sameTradingAddress)c.tradingAddress=Object.assign({},c.address);
  await saveClient(c,'client.created','Onboarding committed via wizard');
  broadcastNow('engagement.signed',{clientId:c.id,hash:c.engagement.letterOfEngagementHash,ts:now(),firmId:state.firm.id});
  // queue engagement letter draft for fallbookspaper
  const draft={id:'eng_'+uuid(),clientId:c.id,kind:'engagement-letter',createdAt:now(),body:buildEngagementLetter(c)};
  await dbPut('engagementQueue',draft);
  broadcastNow('engagement.draftReady',{clientId:c.id,draftId:draft.id,kind:'engagement-letter'});
  toast('Client onboarded · engagement letter draft queued','success');
  state.wizardClientId=null;state.wizardStep=1;state.currentClientId=c.id;render();
}

function importPSCcsv(){
  const c=getWizClient();if(!c)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const text=await f.text();
    const rows=text.split(/\r?\n/).filter(r=>r.trim());
    if(!rows.length)return;
    const header=rows[0].toLowerCase().split(',').map(h=>h.trim());
    const idx={name:header.indexOf('name'),noc:header.indexOf('natureofcontrol'),dob:header.indexOf('dob'),nat:header.indexOf('nationality')};
    let n=0;
    for(let i=1;i<rows.length;i++){
      const cols=rows[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      const name=idx.name>=0?cols[idx.name]:cols[0];
      if(!name)continue;
      c.pscFromCompaniesHouse.push({
        name,
        natureOfControl:idx.noc>=0?cols[idx.noc]:'',
        dob:idx.dob>=0?cols[idx.dob]:'',
        nationality:idx.nat>=0?cols[idx.nat]:''
      });
      n++;
    }
    await saveClient(c,'client.psc.imported',`Imported ${n} PSC rows from CSV`);
    toast(`${n} PSC rows imported`,'success');
    renderWizardOnly();
  };
  inp.click();
}

function pscCacheRow(p){
  return `<tr class="row-link" data-name="${esc((p.companyName||'')+' '+(p.id||'')).toLowerCase()}">
    <td><strong>${esc(p.id)}</strong></td>

  </tr>`;

function bindPSC(){
  const f=$('#pscFilter');if(!f)return;
  f.oninput=e=>{

    document.querySelectorAll('#pscTbody tr').forEach(tr=>{
      tr.style.display=tr.dataset.name.includes(q)?'':'none';
    });

function addPSCCache(){
  const crn=prompt('Companies House number?');if(!crn)return;
  const companyName=prompt('Company name?');
  const pscRaw=prompt('Paste PSC list (one per line: name|natureOfControl|dob|nationality)');
  const pscs=(pscRaw||'').split(/\n/).filter(Boolean).map(l=>{const[n,noc,dob,nat]=l.split('|').map(x=>(x||'').trim());return{name:n,natureOfControl:noc||'',dob:dob||'',nationality:nat||''}});
  const rec={id:crn,companyName,pscs,fetchedAt:now()};
  dbPut('pscCache',rec).then(()=>{
    const idx=state.pscCache.findIndex(x=>x.id===crn);
    if(idx>=0)state.pscCache[idx]=rec;else state.pscCache.push(rec);
    broadcastNow('psc.fetched',rec);
    toast('PSC cached','success');render();
  });
}
function viewPSCcache(crn){
  const p=state.pscCache.find(x=>x.id===crn);if(!p)return;
  const body=`<div class="kpi"><span class="l">CRN</span><span class="v">${esc(p.id)}</span></div>
    <div class="kpi"><span class="l">Company</span><span class="v">${esc(p.companyName||'—')}</span></div>
    <div class="kpi"><span class="l">Fetched</span><span class="v">${fmtDate(p.fetchedAt)}</span></div>

    ${(p.pscs||[]).map(x=>`<div class="psc-row"><div class="pn">${esc(x.name)}<div class="dmeta">${esc(x.natureOfControl)}</div></div><div class="dmeta">${esc(x.dob||'')} · ${esc(x.nationality||'')}</div><div class="pp">PSC</div><span></span></div>`).join('')}`;
  showModal('PSC '+p.id,body);
}
function rmPSCcache(crn){
  if(!confirm('Remove from cache?'))return;
  dbDel('pscCache',crn).then(()=>{
    state.pscCache=state.pscCache.filter(x=>x.id!==crn);render();
  });
}
function exportPSCcache(){
  download(`psc-cache-${fmtDate(now())}.json`,JSON.stringify(state.pscCache,null,2),'application/json');
}

let chatLog=[];
function renderQA(){
  return `
  <div class="section-h"><div><h2>AML Help</h2><div class="sub">${state.settings.tier} · ${T0_RULES.length} rules · BYOK Claude available</div></div>
    <div class="actions"><button class="btn ghost" onclick="openModal('settings')">Settings / BYOK</button></div>

  <div class="chip-row">
    ${T0_RULES.slice(0,12).map(r=>`<span class="chip" onclick="quickAsk('${esc(r.id)}')">${esc(r.title.split('—')[0].trim().toLowerCase())}</span>`).join('')}
  </div>
  <div class="chat" id="chatBox">${chatLog.map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.src?`<div class="src">${esc(m.src)}</div>`:''}</div>`).join('')||'<div class="hint" style="text-align:center;padding:30px;color:var(--cream-muted)">Ask a question to start…</div>'}</div>
  <div class="chat-input">
    <input id="chatInput" placeholder="e.g. ‘When do I need EDD?’" onkeydown="if(event.key==='Enter')ask()">
    <button class="btn primary" onclick="ask()">ask</button>
  </div>
  <div class="foot">${TOOLNAME} v${VERSION} · prime ${PRIME}</div>`;
}
function bindQA(){const i=$('#chatInput');if(i)i.focus()}
function quickAsk(id){
  const r=T0_RULES.find(x=>x.id===id);if(!r)return;
  chatLog.push({role:'user',text:r.title});
  chatLog.push({role:'bot',text:r.body,src:'T0 · '+r.refs.join(' · ')});
  render();
}
async function ask(){
  const q=$('#chatInput').value.trim();if(!q)return;
  $('#chatInput').value='';
  chatLog.push({role:'user',text:q});
  const a=await answer(q);
  chatLog.push({role:'bot',text:a.text,src:a.src});
  render();
}
async function answer(q){
  const ql=q.toLowerCase();
  for(const r of T0_RULES){
    if(r.q.some(k=>ql.includes(k))){
      return {text:r.body,src:'T0 · '+r.refs.join(' · ')};
    }
  }
  if(state.settings.tier==='T3'&&state.settings.apiKey){
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'content-type':'application/json','x-api-key':state.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:state.settings.apiModel,max_tokens:1024,system:'You are an assistant for a UK accountancy firm. Answer concisely. Cite MLR 2017, ICAEW/ACCA codes, Companies Act 2006 sections where relevant. Never invent statute. If unsure, say so.',messages:[{role:'user',content:q}]})
      });
      if(!r.ok)throw new Error(r.statusText);
      const j=await r.json();
      return {text:(j.content||[]).map(c=>c.text).join(''),src:'T3 · Claude ('+state.settings.apiModel+')'};
    }catch(e){return {text:'Claude call failed: '+e.message,src:'T3 error'}}
  }
  return {text:'No direct rule matched. Sample topics: '+T0_RULES.slice(0,4).map(r=>r.title.split('—')[0].trim()).join(' · ')+' · … (or enable T3 BYOK in Settings).',src:'T0 fallback'};
}

function showModal(title,body){
  $('#modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-b">${body}</div></div></div>`;
}
function closeModal(){$('#modalRoot').innerHTML=''}
function renderAuditModal(){
  const rows=state.audit.slice(-200).reverse();
  return `<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn sm" onclick="exportAudit()">Export full audit JSON</button><button class="btn sm ghost" onclick="verifyAudit()">Verify chain</button></div>
    ${rows.map(e=>`<div class="audit-entry"><div class="a-action">#${e.i} · ${esc(e.action)}</div><div class="a-meta">${fmtDT(e.ts)} · ${esc(e.clientId||'(no client)')} · doc ${esc((e.docHash||'').slice(0,12))}</div>${e.reasoning?`<div class="a-reason">${esc(e.reasoning)}</div>`:''}</div>`).join('')||'<div class="hint">No entries.</div>'}`;
}
async function verifyAudit(){
  let prev='GENESIS',ok=true;
  for(const e of state.audit){
    const calc=await sha256(JSON.stringify({prevHash:prev,ts:e.ts,action:e.action,clientId:e.clientId,payload:e.payload}));
    if(calc!==e.docHash){ok=false;break}
    prev=e.docHash;
  }
  toast(ok?'Audit chain verified ('+state.audit.length+' entries)':'CHAIN BROKEN',ok?'success':'warn');
}
function exportAudit(){
  download(`audit-${fmtDate(now())}.json`,JSON.stringify({meta:{tool:TOOLNAME,version:VERSION,exportedAt:now(),count:state.audit.length},audit:state.audit},null,2),'application/json');

async function doImport(){
  try{
    const snap=JSON.parse($('#imp_text').value);
    if(snap.firm){state.firm=snap.firm;await dbPut('firms',snap.firm)}
    if(Array.isArray(snap.advisers))for(const a of snap.advisers){await dbPut('advisers',a);if(!state.advisers.find(x=>x.id===a.id))state.advisers.push(a)}
    if(Array.isArray(snap.clients))for(const c of snap.clients){await dbPut('clients',c);if(!state.clients.find(x=>x.id===c.id))state.clients.push(c)}
    if(snap.meta&&snap.meta.tool&&snap.meta.tool!==TOOLNAME)console.warn('Cross-tool import',snap.meta);
    await audit('snapshot.imported','',`Imported snapshot · ${(snap.clients||[]).length} clients`,{meta:snap.meta||{}});
